<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>누구랑 | 함께 가는 사람에 맞춰 고르는 체험·클래스</title>
  <style>
    body { margin: 0; font-family: "Noto Sans KR", sans-serif; background: #FBF6F1; color: #2E2420; }
    header { background: #B5563A; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 24px; cursor: pointer; }
    nav button { background: none; border: none; color: #fff; font-size: 15px; margin-left: 8px; padding: 6px 12px; border-radius: 16px; cursor: pointer; }
    nav button:hover { background: rgba(255,255,255,0.15); }
    nav button.active { background: #fff; color: #B5563A; font-weight: bold; }
    main { max-width: 760px; margin: 32px auto; padding: 0 16px; }
    h2 { border-left: 4px solid #B5563A; padding-left: 8px; font-size: 18px; }
    .view { display: none; }
    .view.show { display: block; }
    .hero { text-align: center; padding: 24px 0; }
    .hero h2 { border: none; font-size: 28px; margin: 0 0 8px; padding: 0; }
    .hero p { color: #7A6A61; margin: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .card { display: block; background: #fff; border: 1px solid #E3D6CC; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; text-align: left; font: inherit; color: #2E2420; text-decoration: none; cursor: pointer; }
    .card:hover { border-color: #B5563A; }
    .card strong, .card a { color: #B5563A; font-weight: bold; text-decoration: none; }
    .desc { color: #7A6A61; font-size: 14px; margin: 6px 0 0; }
    .guide { background: #fff; border: 1px solid #E3D6CC; border-radius: 8px; padding: 14px 18px; color: #7A6A61; font-size: 14px; line-height: 1.6; }
    .giscus-box { background: #0d1117; border: 1px solid #E3D6CC; border-radius: 8px; padding: 16px; margin-top: 16px; }
    footer { text-align: center; color: #7A6A61; font-size: 13px; padding: 32px; }
  </style>
</head>
<body>
  <header>
    <h1 onclick="showView('home')">누구랑</h1>
    <nav>
      <button id="btn-home" class="active" onclick="showView('home')">홈</button>
      <button id="btn-board" onclick="showView('board')">게시판</button>
      <button id="btn-guestbook" onclick="showView('guestbook')">방명록</button>
    </nav>
  </header>

  <main>
    <!-- ① 홈 화면 -->
    <section id="home" class="view show">
      <div class="hero">
        <h2>누구랑 가세요?</h2>
        <p>함께 가는 사람에 맞춰 고르는 공방 · 체험 · 클래스</p>
      </div>
      <div class="grid">
        <button class="card" onclick="showView('board')">
          <strong>📋 게시판</strong>
          <p class="desc">이슈 게시판 글을 확인해요.</p>
        </button>
        <button class="card" onclick="showView('guestbook')">
          <strong>💬 방명록</strong>
          <p class="desc">누구랑에 한마디 남겨주세요.</p>
        </button>
      </div>
    </section>

    <!-- ② 게시판 화면 -->
    <section id="board" class="view">
      <h2>이슈 게시판 바로가기</h2>
      <div class="card">
        <a href="https://github.com/dohyeon2235020/final-web/issues/1" target="_blank">#1 [누구랑] 게시판 연결 실습 글</a>
        <p class="desc">이슈 게시판으로 이동합니다.</p>
      </div>
  
    </section>

    <!-- ③ 방명록 화면 (giscus) -->
    <section id="guestbook" class="view">
      <h2>방명록</h2>
      <p class="guide">
        누구랑을 찾아주셔서 감사합니다. 자유롭게 한마디 남겨주세요!<br>
        방명록은 GitHub 계정으로 로그인하면 작성할 수 있어요.
      </p>
      <div class="giscus-box">
        <script src="https://giscus.app/client.js"
          data-repo="dohyeon2235020/final-web"
          data-repo-id="R_kgDOVvx7eQ"
          data-category="General"
          data-category-id="DIC_kwDOVvx7ec4DLOXx"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="dark"
          data-lang="ko"
          crossorigin="anonymous"
          async>
        </script>
      </div>
    </section>
  </main>

  <footer>제작 2235020_이도현</footer>

  <script>
    // 메뉴 버튼을 누르면 해당 화면만 보이게 전환
    function showView(name) {
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('show'); });
      document.querySelectorAll('nav button').forEach(function (b) { b.classList.remove('active'); });
      document.getElementById(name).classList.add('show');
      document.getElementById('btn-' + name).classList.add('active');
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
