<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관심 목록 | 누구랑</title>
  <meta name="description" content="찜하고 좋아요 누른 공방·클래스·체험·강의를 모아 보고 바로 예약하세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col">
  <!-- 헤더 · 네비게이션 바 (app.js가 그림 — 메인과 같은 메뉴) -->
  <header id="site-header"></header>

  <main id="main" class="flex-1 w-full">
<!-- MAIN CANVAS -->
<div class="flex-grow w-full max-w-7xl mx-auto px-space-md md:px-gutter-lg py-space-lg md:py-space-xl">
<!-- PAGE HEADER -->
<div class="mb-space-lg flex flex-col md:flex-row md:items-end justify-between border-b border-outline-variant pb-space-md gap-4">
<div>
<div class="flex items-center gap-2 text-label-md font-label-md text-primary mb-1">
<span class="material-symbols-outlined text-sm" data-icon="loyalty">loyalty</span>
<span>내 서재의 아틀리에 큐레이션</span>
</div>
<h1 class="text-headline-xl-mobile md:text-headline-xl font-headline-xl text-on-surface tracking-tight flex items-baseline gap-3">
          나의 관심 목록
          <span class="text-headline-sm font-headline-sm text-outline font-normal">총 <strong class="text-primary font-bold" id="totalCount">0</strong>개 상품</span>
</h1>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant">
        소중한 사람과 함께 만들고 싶은 특별한 공방·체험 리스트입니다.
      </p>
</div>
<!-- TABS (찜한 상품 / 좋아요 누른 상품) -->
<div class="flex items-center gap-4 border-b border-outline-variant mb-space-lg" role="tablist">
<button type="button" role="tab" id="tab-wish" data-on="pb-3 px-2 text-headline-sm font-headline-sm text-primary border-b-2 border-primary transition-all flex items-center gap-2" data-off="pb-3 px-2 text-headline-sm font-headline-sm text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-all flex items-center gap-2" class="pb-3 px-2 text-headline-sm font-headline-sm text-primary border-b-2 border-primary transition-all flex items-center gap-2"><span class="icon fill text-xl">favorite</span><span>내가 찜한 상품</span><span id="wishN" class="px-2 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed text-label-sm font-label-sm">0</span></button>
<button type="button" role="tab" id="tab-like" data-on="pb-3 px-2 text-headline-sm font-headline-sm text-primary border-b-2 border-primary transition-all flex items-center gap-2" data-off="pb-3 px-2 text-headline-sm font-headline-sm text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-all flex items-center gap-2" class="pb-3 px-2 text-headline-sm font-headline-sm text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-all flex items-center gap-2"><span class="icon text-xl">thumb_up</span><span>좋아요 누른 상품</span><span id="likeN" class="px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-sm font-label-sm">0</span></button>
</div>
<!-- CONVENIENCE ACTION BAR -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-space-md mb-space-lg flex flex-wrap items-center justify-between gap-4 shadow-sm">
<div class="flex items-center gap-4">
<!-- Select All Checkbox -->
<label class="flex items-center gap-2 cursor-pointer select-none text-label-lg font-label-lg text-on-surface">
<input checked="" class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container focus:ring-offset-0" id="selectAllCheckbox" type="checkbox">
<span>전체 선택 (<span id="selectedCount">0</span>/<span id="selectedTotal">0</span>)</span>
</label>
<span class="h-4 w-px bg-outline-variant"></span>
<!-- Delete Selected Button -->
<button id="removeSelected" type="button" class="text-body-sm font-body-sm text-on-surface-variant hover:text-error flex items-center gap-1 transition-colors">
<span class="material-symbols-outlined text-base" data-icon="delete">delete</span>
<span>선택 삭제</span>
</button>
</div>
<!-- Filters & Toggles -->
<div class="flex items-center gap-4">
<label class="flex items-center gap-2 cursor-pointer select-none text-body-sm font-body-sm text-on-surface-variant">
<input class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container" id="hideSoldOutToggle" type="checkbox">
<span>품절/마감 상품 제외</span>
</label>
<span class="h-4 w-px bg-outline-variant hidden sm:inline-block"></span>
<div class="text-label-sm font-label-sm text-outline hidden sm:block">
          정렬: <span class="text-on-surface font-semibold">최근 담은 순</span>
</div>
</div>
</div>
<!-- WISHLIST ITEM LIST (Wide Responsive List View) -->
<div class="space-y-4" id="wishlistContainer" aria-live="polite"></div>
<!-- BOTTOM RECOMMENDATION SECTION (동행 추천 클래스 미니 카드 4종) -->
<section class="mt-space-xl pt-space-lg border-t border-outline-variant">
<div class="flex flex-col sm:flex-row sm:items-center justify-between mb-space-md gap-2">
<div>
<span class="text-label-sm font-label-sm font-semibold text-primary tracking-wide">누구랑 취향 맞춤 큐레이션</span>
<h3 class="text-headline-md font-headline-md text-on-surface">
            내가 관심 가진 상품과 함께 보면 좋은 동행 추천
          </h3>
</div>
<a href="shop.html" class="text-label-md font-label-md text-primary hover:underline flex items-center gap-1">
          추천 클래스 더보기
          <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</a>
</div>
<!-- 4-Card Bento Grid -->
<div id="rec" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
</section>
</div>
<!-- FOOTER -->
  </main>

  <footer id="site-footer"></footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="pages.js"></script>
  <script>
// 관심 목록: 찜(ng_wish) · 좋아요(ng_like)
let TAB = qs("tab") === "like" ? "like" : "wish";
const box = document.getElementById("wishlistContainer");
const ids = () => store.get(TAB === "like" ? KEYS.like : KEYS.wish, []).slice().reverse().map(byId).filter(Boolean); // 최근 담은 순

function itemHTML(p) {
  const sold = p.status === "품절";
  const w = p.with[0];
  return `
<article class="wishlist-item group ${sold ? "bg-surface-container-low/70 border-outline-variant/80" : "bg-surface-container-lowest border-outline-variant hover:shadow-md hover:border-primary"} border rounded-xl p-4 md:p-5 flex flex-col md:flex-row gap-5 items-stretch transition-all duration-200" data-id="${p.id}" data-status="${sold ? "soldout" : "available"}">
  <div class="flex items-start gap-3">
    <input checked class="item-checkbox mt-1.5 w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container" type="checkbox" aria-label="${esc(p.title)} 선택">
    <a href="${detailUrl(p)}" class="relative w-28 h-28 sm:w-36 sm:h-36 shrink-0 rounded-lg overflow-hidden bg-surface-variant">
      ${photo(p, "w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" + (sold ? " grayscale-[40%]" : ""))}
      ${sold ? '<div class="absolute inset-0 bg-inverse-surface/60 flex items-center justify-center"><span class="text-white text-label-md font-label-md font-bold border border-white/40 px-2.5 py-1 rounded">예약 마감</span></div>'
             : `<span class="absolute top-2 left-2 bg-primary-container text-on-primary text-label-sm font-label-sm px-2 py-0.5 rounded-full shadow-sm flex items-center gap-1"><span class="icon text-[13px]">${WITH_UI[w].icon}</span>#${withLabel(w)}</span>`}
    </a>
  </div>
  <div class="flex-grow flex flex-col justify-between ${sold ? "opacity-80" : ""}">
    <div>
      <div class="flex items-center gap-2 mb-1.5 flex-wrap"><span class="text-label-sm font-label-sm text-tertiary font-semibold tracking-wide">${TYPES[p.type].name} · ${p.category}</span><span class="text-outline-variant">•</span><span class="text-label-sm font-label-sm text-outline flex items-center gap-0.5"><span class="icon text-xs">location_on</span>${placeOf(p)}</span>${refundBadge(p, REFUND[p.refund].name)}</div>
      <h2 class="text-headline-sm font-headline-sm text-on-surface ${sold ? "line-through decoration-outline" : "hover:text-primary"} transition-colors mb-2"><a href="${detailUrl(p)}">${esc(p.title)}</a></h2>
      <p class="text-body-sm font-body-sm text-on-surface-variant line-clamp-1 mb-3">${esc(p.shop)} · ${esc(p.summary)}${p.priceNote ? " (" + esc(p.priceNote) + ")" : ""}</p>
    </div>
    <div class="flex flex-wrap items-baseline gap-2 pt-2 border-t border-outline-variant/60">
      <span class="text-headline-md font-headline-md font-bold ${sold ? "text-outline" : "text-primary"}">₩${(p.price * p.basePeople).toLocaleString()}</span>
      <span class="text-body-sm font-body-sm text-on-surface-variant">(${p.basePeople}인 기준 총액)</span>
      <span class="text-label-sm font-label-sm text-outline bg-surface-container-high px-1.5 py-0.5 rounded">1인 ₩${p.price.toLocaleString()}</span>
      ${sold ? '<span class="text-label-sm font-label-sm text-outline ml-auto font-medium">품절 (다음 회차 오픈 예정)</span>'
        : p.status === "마감임박" ? `<span class="text-label-sm font-label-sm text-error flex items-center gap-1 ml-auto font-medium"><span class="icon text-sm">priority_high</span> 마감 임박 (평점 ${p.rating.toFixed(2)} · 후기 ${p.reviewCount})</span>`
        : `<span class="text-label-sm font-label-sm text-primary flex items-center gap-1 ml-auto font-medium"><span class="icon fill text-sm">star</span> 평점 ${p.rating.toFixed(2)} (후기 ${p.reviewCount})</span>`}
    </div>
  </div>
  <div class="flex md:flex-col justify-between md:justify-center items-end md:items-stretch gap-2 shrink-0 md:w-36 pt-3 md:pt-0 border-t md:border-t-0 border-outline-variant/60">
    ${sold ? '<button class="w-full py-2.5 px-4 bg-surface-container-high text-on-surface-variant cursor-not-allowed text-label-lg font-label-lg rounded-lg border border-outline-variant" disabled>마감</button>'
      : `<a href="${detailUrl(p)}#book" class="w-full py-2.5 px-4 bg-primary-container hover:bg-secondary text-on-primary text-label-lg font-label-lg rounded-lg shadow-sm transition-all duration-150 active:scale-95 flex items-center justify-center gap-1.5"><span>예약하기</span><span class="icon text-sm">arrow_forward</span></a>`}
    <div class="flex items-center justify-end md:justify-center gap-2 w-full">
      ${TAB === "wish"
        ? `<button type="button" data-remove="${p.id}" class="p-2 text-primary hover:bg-surface-container rounded-lg transition-colors" title="찜 해제"><span class="icon fill">favorite</span></button>`
        : `<button type="button" data-remove="${p.id}" class="p-2 text-primary hover:bg-surface-container rounded-lg transition-colors" title="좋아요 취소"><span class="icon fill">thumb_up</span></button>`}
      <button type="button" data-remove="${p.id}" class="p-2 text-outline hover:text-error hover:bg-surface-container rounded-lg transition-colors" title="목록에서 삭제"><span class="icon">delete</span></button>
    </div>
  </div>
</article>`;
}

function removeIds(list) {
  const key = TAB === "like" ? KEYS.like : KEYS.wish;
  store.set(key, store.get(key, []).filter(id => !list.includes(id)));
  updateInterestBadge();
  render();
}
function counter() {
  const all = [...box.querySelectorAll(".wishlist-item")].filter(a => a.style.display !== "none");
  const on = all.filter(a => a.querySelector(".item-checkbox").checked);
  document.getElementById("selectedCount").textContent = on.length;
  document.getElementById("selectedTotal").textContent = all.length;
  document.getElementById("selectAllCheckbox").checked = all.length > 0 && on.length === all.length;
}
function render() {
  const wishN = store.get(KEYS.wish, []).length, likeN = store.get(KEYS.like, []).length;
  document.getElementById("totalCount").textContent = interestCount();
  document.getElementById("wishN").textContent = wishN;
  document.getElementById("likeN").textContent = likeN;
  ["wish", "like"].forEach(t => {
    const b = document.getElementById("tab-" + t);
    b.className = t === TAB ? b.dataset.on : b.dataset.off;
    b.setAttribute("aria-selected", t === TAB);
    b.querySelector(".icon").classList.toggle("fill", t === TAB);
  });
  const hide = document.getElementById("hideSoldOutToggle").checked;
  const list = ids().filter(p => !hide || p.status !== "품절");
  box.innerHTML = list.length ? list.map(itemHTML).join("") : `
    <div class="py-16 text-center bg-surface-container-lowest rounded-xl border border-outline-variant">
      <span class="icon text-[44px] text-outline-variant">${TAB === "wish" ? "favorite" : "thumb_up"}</span>
      <p class="mt-2 font-headline-sm text-headline-sm">${TAB === "wish" ? "아직 찜한 상품이 없어요" : "아직 좋아요를 누른 상품이 없어요"}</p>
      <p class="text-body-sm text-outline mt-1">상품 카드의 ${TAB === "wish" ? "♥ 버튼" : "👍 버튼"}을 눌러 담아 보세요.</p>
      <a href="shop.html" class="inline-flex mt-4 px-4 py-2 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg">전체 상품 둘러보기</a></div>`;
  counter();
  renderRec();
}
// 함께 보면 좋은 동행 추천 (관심 상품과 같은 동행 태그, 아직 안 담은 상품)
function renderRec() {
  const mine = new Set([...store.get(KEYS.wish, []), ...store.get(KEYS.like, [])]);
  const tags = {};
  [...mine].map(byId).filter(Boolean).forEach(p => p.with.forEach(w => tags[w] = (tags[w] || 0) + 1));
  const score = p => p.with.reduce((s, w) => s + (tags[w] || 0), 0) * 10 + p.rating;
  const rec = PRODUCTS.filter(p => !mine.has(p.id) && p.status !== "품절").sort((a, b) => score(b) - score(a) || b.likes - a.likes).slice(0, 4);
  document.getElementById("rec").innerHTML = rec.map(p => `
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow group flex flex-col justify-between">
  <div class="relative h-44 overflow-hidden bg-surface-variant">
    <a href="${detailUrl(p)}" tabindex="-1">${photo(p, "w-full h-full object-cover group-hover:scale-105 transition-transform duration-300")}</a>
    <span class="absolute top-2.5 left-2.5 bg-primary-container text-on-primary text-label-sm font-label-sm px-2 py-0.5 rounded-full">#${withLabel(p.with[0])}</span>
    ${wishBtn(p, "absolute top-2.5 right-2.5 p-1.5 rounded-full bg-surface-container-lowest/80 text-on-surface-variant hover:text-primary transition-colors")}
  </div>
  <div class="p-3.5 flex flex-col flex-grow justify-between">
    <div><p class="text-label-sm font-label-sm text-tertiary mb-1">${TYPES[p.type].name} · ${p.category} | ${p.region}</p>
      <h4 class="text-headline-sm font-headline-sm text-on-surface line-clamp-1 group-hover:text-primary transition-colors mb-2"><a href="${detailUrl(p)}">${esc(p.title)}</a></h4></div>
    <div class="pt-2 border-t border-outline-variant/50 flex items-center justify-between"><div><span class="text-headline-sm font-headline-sm font-bold text-primary">₩${(p.price * p.basePeople).toLocaleString()}</span><span class="text-label-sm font-label-sm text-outline"> (${p.basePeople}인)</span></div>${refundBadge(p)}</div>
  </div>
</div>`).join("");
}

["wish", "like"].forEach(t => document.getElementById("tab-" + t).addEventListener("click", () => { TAB = t; history.replaceState(null, "", "?tab=" + t); render(); }));
document.getElementById("selectAllCheckbox").addEventListener("change", e => {
  box.querySelectorAll(".wishlist-item").forEach(a => { if (a.style.display !== "none") a.querySelector(".item-checkbox").checked = e.target.checked; });
  counter();
});
document.getElementById("hideSoldOutToggle").addEventListener("change", render);
document.getElementById("removeSelected").addEventListener("click", () => {
  const sel = [...box.querySelectorAll(".item-checkbox:checked")].map(c => c.closest(".wishlist-item").dataset.id);
  if (!sel.length) return toast("삭제할 상품을 선택해 주세요.");
  removeIds(sel); toast(`${sel.length}개 상품을 목록에서 뺐어요.`);
});
box.addEventListener("change", e => { if (e.target.classList.contains("item-checkbox")) counter(); });
box.addEventListener("click", e => {
  const b = e.target.closest("[data-remove]");
  if (!b) return;
  const card = b.closest(".wishlist-item");
  card.style.transition = "all .25s ease-out"; card.style.opacity = "0"; card.style.transform = "translateY(10px)";
  setTimeout(() => removeIds([b.dataset.remove]), 250);
});
document.addEventListener("click", e => { if (e.target.closest("#rec [data-wish]")) setTimeout(render, 0); });
render();

  </script>
</body>
</html>
